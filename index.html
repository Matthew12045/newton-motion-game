<meta charset="utf-8">
<title>กฏการเคลื่อนที่ของนิวตัน</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@300;400;600&family=STIX+Two+Text:ital@0;1&display=swap">
<style>
/* Layout: a fixed 1280×720 storyboard frame scaled to fit the window — stage on the left,
   parameter panel on the right, dialogue bar along the bottom, exactly like the storyboard.
   Deliberately a single light look: the hand-drawn line-art sprite is made for white paper. */
:root{
  --paper:#ffffff;
  --ink:#15181c;
  --slate:#C9D0DA;      /* storyboard panel grey-blue */
  --slate-ink:#56606e;
  --teal:#3D7B74;       /* the cart(?) */
  --red:#FF3B30;        /* force arrows */
  --amber:#FF9F3A;      /* highlighted forces / push gradient */
  --good:#2E8B57;
  --bad:#D64545;
  --backdrop:#E7EBEF;
  --f-ui:"IBM Plex Sans Thai Looped","Noto Sans Thai Looped","Noto Sans Thai",Tahoma,sans-serif;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
body{background:var(--backdrop);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--paper);overflow:hidden;border-radius:6px}
#cv{position:absolute;inset:0;width:1280px;height:720px}
#title{position:absolute;top:20px;left:0;width:1280px;text-align:center;font-size:30px;font-weight:400;pointer-events:none;text-wrap:balance}

/* parameter panel */
#panel{position:absolute;left:896px;top:16px;width:344px;height:524px;background:var(--slate);border-radius:36px;padding:16px 22px 18px;display:flex;flex-direction:column;align-items:center;gap:6px}
.pill{background:#fff;border-radius:14px;padding:5px 20px;font-size:21px}
.params{width:100%;display:flex;flex-direction:column}
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.prow label{font-size:19px;min-width:0}
.prow label i{font-family:var(--f-math)}
.num{display:flex;align-items:baseline;gap:5px;font-family:var(--f-math);font-size:19px;flex:none}
.num input{width:84px;font:inherit;font-size:20px;text-align:right;border:none;border-radius:8px;padding:2px 6px;background:#fff;color:var(--ink);font-variant-numeric:tabular-nums}
.num input:focus-visible{outline:2px solid var(--ink)}
.num input:disabled{opacity:.6}
.rng{width:100%;-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;background:var(--teal);outline:none;margin:9px 0 7px}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#000;cursor:pointer;border:none}
.rng::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:#000;cursor:pointer;border:none}
.rng:focus-visible{box-shadow:0 0 0 4px #fff}
.rng:disabled{opacity:.55}
#panel.multi .prow label{font-size:15px}
#panel.multi .num,#panel.multi .num input{font-size:17px}
#panel.multi .num input{width:72px}
#panel.multi .rng{height:10px;margin:6px 0 3px}
#panel.multi .rng::-webkit-slider-thumb{width:22px;height:22px}
#panel.multi .rng::-moz-range-thumb{width:22px;height:22px}
#panel.multi #readout{grid-template-columns:auto 1fr auto 1fr;column-gap:10px;font-size:15px;padding:6px 12px}
#info{font-size:15px;color:var(--slate-ink);text-align:center;line-height:1.35}
#readout{width:100%;display:grid;grid-template-columns:auto 1fr;gap:0 10px;font-size:16px;line-height:1.35;background:rgba(255,255,255,.55);border-radius:16px;padding:8px 14px;font-variant-numeric:tabular-nums}
#readout dt{font-family:var(--f-math);font-style:italic}
#readout dd{margin:0;text-align:right;font-family:var(--f-math)}
.roCap{align-self:flex-start;font-size:14px;color:var(--slate-ink);margin-bottom:-4px}
#graph{width:300px;height:90px;flex:none;background:#fff;border-radius:12px}
#playBtn{margin-top:auto}
.btnWhite{background:#fff;border:none;border-radius:999px;padding:8px 34px;flex:none;font:inherit;font-size:24px;cursor:pointer;color:var(--ink);transition:transform .12s}
.btnWhite:hover{transform:translateY(-2px)}
.btnWhite:disabled{opacity:.5;cursor:default;transform:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* lesson board */
#board{position:absolute;left:676px;top:100px;width:564px;height:436px;border:3px solid var(--ink);border-radius:36px;background:#fff;padding:20px 30px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center}
#board.top{justify-content:flex-start}
.in{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.math{font-family:var(--f-math);font-style:italic}
.up{font-style:normal}
.sig{font-family:var(--f-math);font-style:normal;font-size:1.25em}
.vec{position:relative;display:inline-block;font-family:var(--f-math);font-style:italic}
.vec::after{content:"";position:absolute;left:18%;right:-4%;top:-.12em;height:.14em;background:
  linear-gradient(currentColor,currentColor) left center/100% 1.5px no-repeat}
.vec::before{content:"";position:absolute;right:-8%;top:-.25em;border:.16em solid transparent;border-left:.3em solid currentColor;border-right:0}
.eqBig{font-size:56px;line-height:1.1;font-family:var(--f-math)}
.eqMid{font-size:30px;font-family:var(--f-math)}
.cap{font-size:22px}
.small{font-size:17px;color:var(--slate-ink)}
.row{width:100%;padding:8px 12px;border-radius:14px;font-size:21px;transition:background .25s,opacity .25s;opacity:.4}
.row.on{background:#FFF1E0;opacity:1}
.row.done{opacity:1}
.law{border-radius:20px;background:#EEF4F3;padding:14px 18px;font-size:21px;line-height:1.5;text-align:left}
.law b{color:var(--teal)}
.tbl{border-collapse:collapse;font-size:20px;width:100%}
.tbl td,.tbl th{padding:7px 8px;border-bottom:1px solid #dde2e8}
.tbl th{font-weight:600;font-size:17px;color:var(--slate-ink)}
.tbl td{font-family:var(--f-math)}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:8px;padding:1px 10px;font-size:15px;letter-spacing:.04em}
.q{font-size:22px;line-height:1.45;text-align:left;width:100%}
.opts{display:flex;flex-direction:column;gap:9px;width:100%}
.opt{text-align:left;background:#F3F5F8;border:2px solid transparent;border-radius:14px;padding:9px 14px;font:inherit;font-size:18px;line-height:1.4;cursor:pointer}
.opt:hover{border-color:var(--slate)}
.opt.right{background:#E3F4EA;border-color:var(--good)}
.opt.wrong{background:#FBE7E7;border-color:var(--bad);opacity:.7}
.opt:disabled{cursor:default}

/* dialogue bar */
#dialog{position:absolute;left:52px;top:552px;width:1188px;height:150px;background:var(--slate);border-radius:36px;display:flex;align-items:center;padding:0 18px 0 56px;gap:24px;cursor:pointer}
#dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:18px}
#dtext{font-size:22px;line-height:1.45;text-wrap:pretty}
#dtext b{font-weight:600}
#choices{display:flex;gap:12px;flex-wrap:wrap}
.choice{background:#fff;border:none;border-radius:999px;padding:6px 20px;font:inherit;font-size:19px;cursor:pointer}
.choice:hover{background:#F2F4F7}
#next{position:absolute;right:226px;bottom:6px;background:none;border:none;font:inherit;font-size:17px;color:var(--slate-ink);cursor:pointer;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
#portrait{width:180px;height:128px;background:#fff;border-radius:30px;position:relative;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:visible}
#portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 8%;border-radius:30px}
#portrait .name{font-size:26px}
#portrait .sub{font-size:22px}
#portrait .q4{font-size:22px;letter-spacing:.1em;color:var(--slate-ink)}
#portrait .nm{position:absolute;bottom:-12px;right:-6px;background:var(--ink);color:#fff;font-size:14px;border-radius:8px;padding:1px 9px}
.hp{position:absolute;top:-16px;left:4px;width:176px;height:18px;display:flex;align-items:center}
.hp::before{content:"♥";color:var(--red);font-size:26px;line-height:1;position:relative;z-index:1;text-shadow:0 0 0 #000}
.hp i{flex:1;height:12px;margin-left:-6px;background:#A890A8;border:2px solid #3b3550;border-radius:3px;position:relative;overflow:hidden}
.hp i::after{content:"";position:absolute;inset:0;background:#E74C3C;animation:drain 2.4s ease-out forwards}
@keyframes drain{from{right:0}to{right:92%}}

/* full-stage overlays */
#overlay{position:absolute;inset:0;background:rgba(255,255,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:40px}
#overlay h1{font-size:68px;font-weight:600;margin:0;letter-spacing:.01em}
#overlay h2{font-size:26px;font-weight:300;margin:0;color:var(--slate-ink)}
#overlay .bigRed{font-size:150px;color:var(--red);font-weight:400;line-height:1}
#overlay .links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:17px;color:var(--slate-ink)}
#overlay .links button{background:none;border:1px solid var(--slate);border-radius:999px;padding:5px 16px;font:inherit;cursor:pointer;color:var(--ink)}
.heroRow{display:flex;align-items:flex-end;gap:6px}
.heroRow img{height:170px}
.heroCart{width:92px;height:82px;background:var(--teal);border-radius:24px;margin-bottom:0}
.sumGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:1180px;text-align:left}
.sumGrid .law{font-size:17px;padding:12px 16px}
.btnDark{background:var(--ink);color:#fff;border:none;border-radius:999px;padding:12px 36px;font:inherit;font-size:22px;cursor:pointer}
.btnGhost{background:none;color:var(--ink);border:2px solid var(--slate);border-radius:999px;padding:10px 30px;font:inherit;font-size:21px;cursor:pointer}
.startRow{display:flex;gap:14px;align-items:center;justify-content:center}
/* who is playing (name + class) */
.who{display:flex;gap:18px;align-items:center;font-size:20px}
.who label{display:flex;gap:8px;align-items:center}
.who input{font:inherit;font-size:20px;width:230px;padding:6px 14px;border:2px solid var(--slate);border-radius:12px;color:var(--ink);background:#fff}
.who input#whoRoom{width:150px}
.who input:focus-visible{outline:none;border-color:var(--ink)}
.who input.err{border-color:var(--bad);background:#FBE7E7}
.whoHint{font-size:16px;color:var(--bad);min-height:1.2em;margin-top:-10px}
/* end-of-game feedback */
.fb{display:flex;flex-direction:column;gap:16px;width:900px;text-align:left;font-size:21px}
.fbRow{display:grid;grid-template-columns:220px 1fr;align-items:center;gap:4px 16px}
.fbRow small{grid-column:2;font-size:14px;color:var(--slate-ink)}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale button{min-width:56px;background:#F3F5F8;border:2px solid transparent;border-radius:12px;padding:6px 14px;font:inherit;font-size:18px;cursor:pointer;color:var(--ink)}
.scale button:hover{border-color:var(--slate)}
.scale button[aria-pressed="true"]{background:#EEF4F3;border-color:var(--teal);font-weight:600}
#fbQ{font:inherit;font-size:18px;width:100%;height:80px;resize:none;border:2px solid var(--slate);border-radius:14px;padding:8px 14px;color:var(--ink)}
#fbQ:focus-visible{outline:none;border-color:var(--ink)}
#rewind{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;background:rgba(120,90,40,.18);font-size:46px;color:#5a4320;letter-spacing:.05em}
#rewind span{background:rgba(255,255,255,.85);padding:8px 28px;border-radius:999px}
#thumb{position:absolute;left:720px;top:104px;font-size:120px;line-height:1;pointer-events:none;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
#rotate{position:fixed;left:16px;right:16px;bottom:16px;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv" width="1280" height="720" aria-label="ฉากจำลองการเคลื่อนที่"></canvas>
    <div id="title"></div>

    <div id="panel" hidden>
      <div class="pill">ตั้งค่าพารามิเตอร์</div>
      <div id="params" class="params"></div>
      <div id="info"></div>
      <div id="roCap" class="roCap" hidden></div>
      <dl id="readout"></dl>
      <canvas id="graph" width="600" height="180" aria-label="กราฟความเร็วกับเวลา"></canvas>
      <button id="playBtn" class="btnWhite">ผลัก/เล่น</button>
    </div>

    <div id="board" hidden></div>

    <div id="dialog" hidden>
      <div id="dbody">
        <div id="dtext"></div>
        <div id="choices"></div>
      </div>
      <div id="portrait"></div>
      <button id="next" hidden>คลิกเพื่อไปต่อ ▸</button>
    </div>

    <div id="rewind" hidden><span>⏪ ย้อนเวลา…</span></div>
    <div id="overlay" hidden></div>
  </div>
  <div id="rotate" hidden>หมุนจอเป็นแนวนอนจะอ่านง่ายขึ้น</div>
</div>

/* ---------- fit the 1280×720 frame to the window ---------- */
function fit(){
  const vw = innerWidth, vh = innerHeight;
  const s = Math.min(vw/W, vh/H);
  stage.style.transform = `translate(${(vw-W*s)/2}px,${(vh-H*s)/2}px) scale(${s})`;
  const k = Math.min(3, s*(devicePixelRatio||1));
  cv.width = Math.round(W*k); cv.height = Math.round(H*k);
  ctx.setTransform(k,0,0,k,0,0);
  $('rotate').hidden = !(vh > vw && vw < 700);
}
addEventListener('resize', fit); fit();

/* ---------- tiny event bus + async helpers ---------- */
let waiters = {};
function emit(n, d){ const w = waiters[n] || []; waiters[n] = []; w.forEach(f => f(d)); }
function waitEvent(n){ return new Promise(r => (waiters[n] = waiters[n] || []).push(r)); }
function waitAny(names){ return Promise.race(names.map(n => waitEvent(n).then(d => ({ name:n, data:d })))); }
const sleep = ms => new Promise(r => setTimeout(r, ms));

const store = {                        // localStorage can throw (private mode, blocked storage): never let it break the game
  get(k, d){ try { const v = localStorage.getItem('nmg.' + k); return v == null ? d : JSON.parse(v); } catch (e){ return d; } },
  set(k, v){ try { if (v == null) localStorage.removeItem('nmg.' + k); else localStorage.setItem('nmg.' + k, JSON.stringify(v)); } catch (e){} }
};
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
const r2 = x => Math.round(x*100)/100;
const plain = html => html.replace(/<[^>]*>/g, '').replace(/\\[()]/g, '').replace(/&thinsp;|&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();

const track = {
  deviceId: store.get('device', null),
  student: store.get('student', null),           // { name, room }
  sessionId: uid(), session: null, sec: null, visited: [], feedbackDone: false,
  outbox: store.get('outbox', []), sending: false,
  activeMs: 0, clockAt: performance.now(), lastInput: performance.now(), vis: document.visibilityState === 'visible',
  panelAt: performance.now(), moves: 0, typed: false, armed: null, lastInputs: {},

  /* active-time clock: counts only while the tab is visible and someone touched it in the last minute */
  tick(){
    const now = performance.now(), dt = Math.min(now - this.clockAt, 5000);
    this.clockAt = now;
    if (!this.vis) return;
    const on = now - this.lastInput < IDLE_MS;
    if (on) this.activeMs += dt;
    if (this.sec) this.sec[on ? 'active' : 'idle'] += dt;
  },

  /* events */
  ev(type, data){
    const s = this.student || {};
    return Object.assign({ type, eid:uid(), ts:new Date().toISOString(), sessionId:this.sessionId,
      name:s.name || '', room:s.room || '' }, data);
  },
  queue(e){
    this.outbox.push(e);
    if (this.outbox.length > 3000) this.outbox.splice(0, this.outbox.length - 3000);
    store.set('outbox', this.outbox);
    clearTimeout(this.flushT); this.flushT = setTimeout(() => this.flush(), 1500);
  },
  push(type, data){ this.queue(this.ev(type, data)); },
  flush(beacon){
    if (!LOG_URL || !this.outbox.length) return;
    if (!beacon && (this.sending || navigator.onLine === false)) return;
    const batch = this.outbox.slice(0, 100), ids = new Set(batch.map(e => e.eid));
    const body = JSON.stringify({ events:batch });
    const done = () => { this.outbox = this.outbox.filter(e => !ids.has(e.eid)); store.set('outbox', this.outbox); };
    if (beacon){
      try { if (navigator.sendBeacon && navigator.sendBeacon(LOG_URL, new Blob([body], { type:'text/plain;charset=utf-8' }))) done(); } catch (e){}
      return;
    }
    this.sending = true;
    fetch(LOG_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body })
      .then(r => r.json())
      .then(j => { this.sending = false; if (j && j.ok){ done(); if (this.outbox.length) this.flush(); } })
      .catch(() => { this.sending = false; });          // stays queued; retried later
  },

  /* sessions and sections (= where the time goes) */
  sessionRow(){
    const s = this.session;
    return { deviceId:this.deviceId, startedAt:s.startedAt, entry:s.entry, runs:s.runs, lastStep:s.lastStep,
      furthest:s.furthest, reachedEnd:s.reachedEnd, activeMin:r2(this.activeMs/60000),
      device:`${matchMedia('(pointer:coarse)').matches ? 'touch' : 'mouse'} ${screen.width}×${screen.height}` };
  },
  begin(entry){
    if (!this.deviceId){ this.deviceId = uid(); store.set('device', this.deviceId); }
    if (!this.session) this.session = { startedAt:new Date().toISOString(), entry, runs:0, lastStep:'', furthest:'', reachedEnd:false };
    this.session.runs++;
    this.push('session', this.sessionRow());
  },
  enter(name){
    this.leave(true);
    this.sec = { name, eid:uid(), enteredAt:new Date().toISOString(), active:0, idle:0, lines:[], line:null, attempts:0, hints:0 };
    if (!this.visited.includes(name)) this.visited.push(name);
    const order = Object.keys(PART_NAME), s = this.session;
    s.lastStep = name;
    if (order.indexOf(name) > order.indexOf(s.furthest)) s.furthest = name;
    if (name === 'end') s.reachedEnd = true;
  },
  sectionEv(completed, partial){
    const s = this.sec, lines = s.lines.concat(s.line ? [[s.active - s.line.at, s.line.text]] : []);
    const slow = lines.slice().sort((a, b) => b[0] - a[0]).slice(0, 3);
    return this.ev('section', { eid:s.eid + (partial ? '-p' : ''), section:s.name, part:PART_NAME[s.name], enteredAt:s.enteredAt,
      activeSec:Math.round(s.active/1000), idleSec:Math.round(s.idle/1000), completed:!!completed, partial:!!partial,
      lines:lines.length, slowLines:slow.map(([ms, t]) => `${Math.round(ms/1000)} s: ${t}`).join(' | ') });
  },
  leave(completed, partial){
    if (!this.sec) return;
    this.tick();
    this.queue(this.sectionEv(completed, partial));
    this.sec = null;
    store.set('open', null);
    this.push('session', this.sessionRow());
  },
  // the page may be killed while hidden without a pagehide: keep the open section so the next load can report it
  snapshot(){
    if (this.sec) store.set('open', [this.sectionEv(false, true), this.ev('session', this.sessionRow())]);
  },
  // dialogue lines the student has to click through: how long each one stayed on screen
  line(html){
    const s = this.sec; if (!s) return;
    this.tick();
    if (s.line) s.lines.push([s.active - s.line.at, s.line.text]);
    s.line = html == null ? null : { at:s.active, text:plain(html).slice(0, 60) };
  },

  /* level attempts + how the student picked the value (drag around vs. type an exact number) */
  arm(){ this.panelAt = performance.now(); this.moves = 0; this.typed = false; },
  onPlay(){ this.armed = { thinkSec:Math.round((performance.now() - this.panelAt)/100)/10, moves:this.moves, typed:this.typed }; },
  attempt(inputs, outcome, err){
    const s = this.sec; if (!s) return;
    s.attempts++;
    const a = this.armed || {}, prev = this.lastInputs[s.name];
    const change = !prev ? '' : Object.keys(inputs).map(k => {
      const d = r2(inputs[k] - prev[k]);
      return d ? `${k} ${d > 0 ? '+' : ''}${d}` : '';
    }).filter(Boolean).join(', ') || 'same';
    this.lastInputs[s.name] = inputs;
    this.push('attempt', { section:s.name, attemptNo:s.attempts, F:inputs.F, m:inputs.m, mu:inputs.mu, v:inputs.v,
      outcome, errM:err == null ? '' : r2(err), thinkSec:a.thinkSec, sliderMoves:a.moves, typedExact:a.typed,
      change, hintsBefore:s.hints });
    this.armed = null;
  },
  hint(){ if (this.sec) this.sec.hints++; },
  choice(question, pick){
    this.push('choice', { section:this.sec ? this.sec.name : '', question:plain(question).slice(0, 80), pick,
      afterAttempts:this.sec ? this.sec.attempts : '' });
  },
  quiz(id, picks, correct, tags, msFirst, msTotal){
    this.push('quiz', { section:this.sec ? this.sec.name : '', quizId:id, firstTryCorrect:picks[0] === correct, tries:picks.length,
      picks:picks.map(i => 'กขคง'[i]).join(' → '), wrongTags:picks.filter(i => i !== correct).map(i => tags[i]).join(', '),
      secToFirstPick:Math.round(msFirst/100)/10, secTotal:Math.round(msTotal/100)/10 });
  },
  feedback(ans){ this.feedbackDone = true; this.push('feedback', ans); },

  /* where to continue next time (per student, in this browser) */
  progressOf(st){ return st ? store.get('progress', {})[`${st.room}|${st.name}`] || null : null; },
  saveProgress(next){
    const all = store.get('progress', {});
    all[`${this.student.room}|${this.student.name}`] = { next, memo:{ F:memo.F, v1:memo.v1, fric:memo.fric } };
    store.set('progress', all);
  }
};
const stopOutcome = r => r.name === 'gone' ? 'gone' : r.data.ok ? 'success' : r.data.err < 0 ? 'short' : 'long';

(() => {
  const open = store.get('open', null);        // a section left open by a page that was closed while hidden
  if (open){ open.forEach(e => track.queue(e)); store.set('open', null); }
  ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(t =>
    addEventListener(t, () => { track.lastInput = performance.now(); }, { passive:true, capture:true }));
  setInterval(() => track.tick(), 1000);
  setInterval(() => track.flush(), 30000);
  addEventListener('online', () => track.flush());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){ track.vis = true; track.clockAt = performance.now(); return; }
    track.tick(); track.vis = false;
    track.snapshot(); track.flush(true);
  });
  addEventListener('pagehide', () => {
    if (track.sec){ track.reopen = track.sec.name; track.leave(false, true); }
    track.flush(true);
  });
  addEventListener('pageshow', e => {           // back from the bfcache: keep timing the same part
    if (e.persisted && track.reopen && track.session){ track.enter(track.reopen); track.reopen = null; }
  });
  track.flush();
})();

/* ---------- dialogue ---------- */
let advance = null;
function renderSpeaker(who, o){
  const p = $('portrait');
  if (who === 'ryuka'){
    p.innerHTML = `<img src="${(o.sad ? IMG.sad : IMG.n).src}" alt="ริวกะ"><span class="nm">ริวกะ</span>` + (o.panic ? '<div class="hp"><i></i></div>' : '');
  } else if (who === 'you'){
    p.innerHTML = `<div class="q4">????</div><div class="sub">ผัวริวกะ</div>`;
  } else {
    p.innerHTML = `<div class="name">พ่อมัน</div>`;
  }
}
function say(who, html, o = {}){
  track.line(o.wait === false && !o.choices ? null : html);   // prompts left up while playing aren't reading time
  $('dialog').hidden = false;
  renderSpeaker(who, o);
  const t = $('dtext');
  t.innerHTML = html;
  t.style.fontSize = '';
  if (t.scrollHeight > 70) t.style.fontSize = '19px';
  if (html.includes('\\(') && window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise([t]).catch(() => {});
  t.classList.remove('in'); void t.offsetWidth; t.classList.add('in');
  const ch = $('choices'); ch.innerHTML = '';
  $('next').hidden = true; advance = null;
  if (o.choices){
    return new Promise(res => o.choices.forEach((c, i) => {
      const b = document.createElement('button');
      b.className = 'choice'; b.textContent = c;
      b.onclick = e => { e.stopPropagation(); ch.innerHTML = ''; track.choice(html, c); res(i); };
      ch.append(b);
    }));
  }
  if (o.wait === false) return Promise.resolve();
  $('next').hidden = false;
  return new Promise(res => { advance = () => { advance = null; $('next').hidden = true; res(); }; });
}
$('dialog').addEventListener('click', () => advance && advance());
addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && advance){
    const a = document.activeElement;
    if (a && (a.tagName === 'BUTTON' || a.tagName === 'INPUT') && a.id !== 'next') return;
    e.preventDefault(); advance();
  }
});

/* ---------- board / overlay ---------- */
function board(html, top = false){
  const b = $('board');
  if (html == null){ b.hidden = true; return b; }
  b.hidden = false; b.classList.toggle('top', top);
  b.innerHTML = html;
  b.classList.remove('in'); void b.offsetWidth; b.classList.add('in');
  return b;
}
function overlay(html){
  const o = $('overlay');
  if (html == null){ o.hidden = true; return o; }
  o.hidden = false; o.innerHTML = html;
  return o;
}
function setTitle(t){ $('title').textContent = t; }
const SF = (sub = '') => `<span class="sig">Σ</span><span class="vec">F</span>${sub ? `<sub class="math">${sub}</sub>` : ''}`;

/* ---------- parameter panel ---------- */
const PDEF = {
  F:  { label:'แรงผลัก', sym:'F', unit:'N' },
  m:  { label:'มวลรวม', sym:'m', unit:'kg' },
  mu: { label:'สัมประสิทธิ์ความเสียดทาน', sym:'μ', unit:'' },
  v:  { label:'ความเร็วรถ', sym:'v', unit:'m/s' }
};
const MOTION_ROWS = [['ΣF<sub>x</sub>','N'],['a','m/s²'],['v','m/s'],['x','m'],['t','s']];
const MODES = {
  push:    { params:[['F',0,300,10]], btn:'ผลัก/เล่น', graph:true, rows:MOTION_ROWS,
             info:() => 'มวลรถ(?) + ริวกะ = 40 kg<br>ผลักแค่ช่วง 0.8 m แรก' },
  fric:    { params:[['F',0,300,1]], btn:'ผลัก/เล่น', graph:true, rows:MOTION_ROWS,
             info:() => 'm = 40 kg · μ = 0.10 · f = μmg = 39.24 N<br>ผลักแค่ช่วง 0.8 m แรก' },
  sandbox: { params:[['F',0,1000,1],['m',20,80,1],['mu',0,0.25,0.01]], btn:'ผลัก/เล่น', graph:true, rows:MOTION_ROWS,
             info:p => `แรงเสียดทาน f = μmg = ${(p.mu*p.m*G).toFixed(2)} N` },
  speed:   { params:[['v',0,8,0.1]], btn:'ปล่อยรถ/เล่น', graph:false,
             rows:[['t','s'],['t<sub>ลอย</sub>','s'],['x','m'],['Δy','m'],['v<sub>x</sub>','m/s'],['v<sub>y</sub>','m/s']],
             info:() => 'x = 0 ที่ขอบแท่น · t นับจากจุดปล่อยรถ<br>h = 1.9 m · D = 3.0 m · g = 9.81 m/s²' }
};
const pval = { F:40, m:40, mu:0.1, v:3 };
let panelMode = null, readRows = [];
function showPanel(mode, init = {}){
  panelMode = mode;
  const p = $('panel');
  if (!mode){ p.hidden = true; return; }
  const M = MODES[mode];
  Object.assign(pval, init);
  p.hidden = false;
  p.classList.toggle('multi', M.params.length > 1);
  $('params').innerHTML = M.params.map(([k, min, max, step]) => {
    const d = PDEF[k];
    return `<div class="prow"><label for="r_${k}">${d.label} <i>${d.sym}</i></label>
      <span class="num"><input type="number" id="n_${k}" min="${min}" max="${max}" step="${step}" aria-label="${d.label}">${d.unit ? `<span>${d.unit}</span>` : ''}</span></div>
      <input type="range" class="rng" id="r_${k}" min="${min}" max="${max}" step="${step}">`;
  }).join('');
  M.params.forEach(([k, min, max, step]) => {
    const r = $('r_'+k), n = $('n_'+k), dec = (String(step).split('.')[1] || '').length;
    const set = (val, from) => {
      if (!isFinite(val)) val = pval[k];
      val = +Math.min(max, Math.max(min, Math.round(val/step)*step)).toFixed(dec);
      pval[k] = val;
      if (from !== 'r') r.value = val;
      if (from !== 'n') n.value = val.toFixed(dec);
      $('info').innerHTML = M.info(pval);
      if (scene && scene.onParam) scene.onParam(pval);
    };
    r.addEventListener('input', () => set(+r.value, 'r'));
    r.addEventListener('change', () => { track.moves++; });                  // once per drag / key press
    n.addEventListener('change', () => { track.moves++; track.typed = true; set(parseFloat(n.value)); });
    n.addEventListener('input', () => {                    // live while typing, without rewriting the box
      const val = parseFloat(n.value);
      if (isFinite(val) && val >= min && val <= max){
        pval[k] = val; r.value = val;
        $('info').innerHTML = M.info(pval);
        if (scene && scene.onParam) scene.onParam(pval);
      }
    });
    set(pval[k]);
  });
  $('playBtn').textContent = M.btn;
  $('graph').hidden = !M.graph;
  readRows = M.rows;
  $('readout').innerHTML = readRows.map((r, i) => `<dt>${r[0]}</dt><dd id="ro${i}">–</dd>`).join('');
}
function lockPanel(on){
  $('panel').querySelectorAll('input,button').forEach(el => el.disabled = on);
  if (!on) track.arm();
}
$('playBtn').addEventListener('click', () => { track.onPlay(); emit('play', { ...pval }); });
function updateReadout(){
  if (!scene || !scene.readout) return;
  const vals = scene.readout();
  vals.forEach((v, i) => { const el = $('ro'+i); if (el) el.textContent = v == null ? '–' : `${v} ${readRows[i][1]}`.trim(); });
  const note = scene.readoutNote ? scene.readoutNote() : null, cap = $('roCap');
  cap.hidden = !note; if (note) cap.textContent = note;
  if (MODES[panelMode] && MODES[panelMode].graph && scene.hist) drawGraph(scene.hist);
}
function drawGraph(hist){
  const g = $('graph'), c = g.getContext('2d');
  c.setTransform(2,0,0,2,0,0);
  c.clearRect(0,0,300,90);
  const x0 = 34, y0 = 76, w = 252, h = 56;
  const tMax = Math.max(4, hist.length ? hist[hist.length-1].t * 1.1 : 4);
  const vMax = Math.max(1, ...hist.map(p => p.v)) * 1.25;
  c.strokeStyle = '#9aa3ae'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(x0, y0-h-6); c.lineTo(x0, y0); c.lineTo(x0+w, y0); c.stroke();
  c.fillStyle = '#56606e'; c.font = `italic 12px ${MATH}`;
  c.fillText('v', x0-14, y0-h+6); c.fillText('t', x0+w+5, y0+4);
  c.font = `11px ${FONT}`; c.fillText('กราฟ v–t', x0+6, 12);
  if (hist.length < 2) return;
  c.strokeStyle = COL.teal; c.lineWidth = 2.2; c.beginPath();
  hist.forEach((p, i) => { const X = x0 + p.t/tMax*w, Y = y0 - p.v/vMax*h; i ? c.lineTo(X, Y) : c.moveTo(X, Y); });
  c.stroke();
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function arrow(x1, y1, x2, y2, color, w = 9, head = 22){
  const ang = Math.atan2(y2-y1, x2-x1), len = Math.hypot(x2-x1, y2-y1);
  if (len < 3) return;
  const hd = Math.min(head, len*0.6);
  ctx.save(); ctx.translate(x1, y1); ctx.rotate(ang);
  ctx.fillStyle = color;
  ctx.fillRect(0, -w/2, len-hd+1, w);
  ctx.beginPath(); ctx.moveTo(len, 0); ctx.lineTo(len-hd, -hd*0.72); ctx.lineTo(len-hd, hd*0.72); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function gradArrow(x1, y, x2, w = 12){
  const g = ctx.createLinearGradient(x1, 0, x2, 0);
  g.addColorStop(0, '#FFD54F'); g.addColorStop(1, COL.amber);
  arrow(x1, y, x2, y, g, w, 26);
}
function text(t, x, y, o = {}){
  ctx.font = o.math ? `${o.italic === false ? '' : 'italic '}${o.size || 22}px ${MATH}`
                    : `${o.weight || 400} ${o.size || 20}px ${FONT}`;
  // Position by measuring instead of relying on ctx.textAlign, which some viewers ignore.
  ctx.textAlign = 'left'; ctx.textBaseline = o.base || 'alphabetic';
  const w = ctx.measureText(t).width;
  const x0 = o.align === 'center' ? x - w/2 : o.align === 'right' ? x - w : x;
  ctx.fillStyle = o.color || COL.ink; ctx.fillText(t, x0, y);
  return w;
}
const P = (v, x) => v.ox + x*v.s;
const Y = (v, y) => v.gy - y*v.s;

function drawFloor(v, o = {}){
  const gy = v.gy;
  const sc = (o.scroll || 0) * v.s;
  if (o.rough){
    ctx.fillStyle = COL.rough; ctx.fillRect(0, gy, W, 30);
    ctx.strokeStyle = COL.roughLine; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    ctx.fillStyle = COL.roughLine;
    for (let i = 0; i < 240; i++){
      const x = ((i*61.3 - sc) % W + W) % W, y = gy + 4 + (i*37 % 23);
      ctx.fillRect(x, y, 2.4, 2.4);
    }
  } else {
    ctx.fillStyle = COL.ice; ctx.fillRect(0, gy, W, 30);
    ctx.strokeStyle = COL.iceLine; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke();
    // glints on the ice
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2;
    for (let i = -1; i < 16; i++){
      const x = ((i*97 - sc) % (16*97) + 16*97) % (16*97) - 60;
      ctx.beginPath(); ctx.moveTo(x, gy+9); ctx.lineTo(x+26, gy+9); ctx.moveTo(x+38, gy+19); ctx.lineTo(x+50, gy+19); ctx.stroke();
    }
  }
  if (o.ticks){
    const { from, to, zero = 0 } = o.ticks;
    ctx.strokeStyle = COL.iceLine; ctx.lineWidth = 1.5;
    for (let m = from; m <= to; m++){
      const x = P(v, zero + m) - sc % v.s * (o.scroll ? 1 : 0);
      ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy+8); ctx.stroke();
      if (!o.scroll) text(`${m < 0 ? '−' + (-m) : m} m`, x, gy+26, { size:13, align:'center', color:COL.muted });
    }
  }
  if (o.label) text(o.label, 14, gy+24, { size:14, color:COL.muted });
}
function drawFlag(x, gy, s){
  const top = gy - 1.55*s;
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#000';
  ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x+5, gy-2); ctx.lineTo(x-4, top); ctx.stroke();
  ctx.beginPath(); ctx.arc(x-4, top-4, 9, 0, 7); ctx.fill();
  const fx = x, fy = top + 10, fw = 0.72*s, fh = 0.46*s;
  ctx.beginPath();
  ctx.moveTo(fx, fy+6);
  ctx.bezierCurveTo(fx+fw*0.3, fy-8, fx+fw*0.55, fy+16, fx+fw, fy);
  ctx.lineTo(fx+fw, fy+fh);
  ctx.bezierCurveTo(fx+fw*0.6, fy+fh+16, fx+fw*0.35, fy+fh-12, fx+6, fy+fh+6);
  ctx.closePath(); ctx.fill();
}
function drawCart(cx, baseY, s, sub){
  const w = 0.8*s, h = 0.7*s;
  rr(cx - w/2, baseY - h, w, h, 0.24*s); ctx.fillStyle = COL.teal; ctx.fill();
  text('รถ(?)', cx, baseY - h + 22, { size:16, align:'center', color:'rgba(255,255,255,.85)' });
  if (sub) text(sub, cx, baseY - 15, { size:15, align:'center', color:'rgba(255,255,255,.9)', math:true, italic:false });
}
function drawRyuka(x, feetY, s, o = {}){
  const img = o.sad ? IMG.sad : IMG.n;
  if (!img.complete || !img.naturalWidth) return;
  const h = 1.2*s, w = h * img.naturalWidth / img.naturalHeight;
  ctx.save();
  ctx.translate(x, o.lie ? feetY - w/2 + 4 : feetY - h/2);
  if (o.rot) ctx.rotate(o.rot);
  ctx.drawImage(img, -w/2, -h/2, w, h);
  ctx.restore();
}
function dimLine(x1, y1, x2, y2, label, o = {}){
  ctx.strokeStyle = o.color || COL.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const vert = x1 === x2, k = 7;
  ctx.beginPath();
  if (vert){ ctx.moveTo(x1-k, y1); ctx.lineTo(x1+k, y1); ctx.moveTo(x2-k, y2); ctx.lineTo(x2+k, y2); }
  else { ctx.moveTo(x1, y1-k); ctx.lineTo(x1, y1+k); ctx.moveTo(x2, y2-k); ctx.lineTo(x2, y2+k); }
  ctx.stroke();
  if (label){
    if (vert) text(label, x1 + 10, (y1+y2)/2 + 6, { size:18, color:o.color, math:o.math });
    else text(label, (x1+x2)/2, y1 + 24, { size:17, align:'center', color:o.color, math:o.math });
  }
}
function fbd(cx, cy, o = {}){
  const L = 62;
  const cy2 = o.hiY ? COL.amber : COL.red;
  arrow(cx, cy, cx, cy - L, cy2, 9, 20);
  arrow(cx, cy, cx, cy + L, cy2, 9, 20);
  text('N', cx - 20, cy - L + 10, { math:true, size:24, align:'right', color:cy2 === COL.amber ? '#c46a00' : COL.ink });
  text('mg', cx - 18, cy + L - 2, { math:true, size:24, align:'right', color:cy2 === COL.amber ? '#c46a00' : COL.ink });
  if (o.showF !== false){
    arrow(cx, cy, cx + L*1.15, cy, COL.red, 9, 20);
    text('F', cx + L*1.15 + 8, cy + 8, { math:true, size:24 });
    text('ผลัก', cx + L*1.15 + 24, cy + 14, { size:13, color:COL.muted });
  }
  if (o.f){
    arrow(cx, cy, cx - L*0.95, cy, COL.fric, 9, 20);
    text('f', cx - L*0.95 - 10, cy + 8, { math:true, size:24, align:'right', color:COL.fric });
  }
  ctx.fillStyle = COL.ink; ctx.beginPath(); ctx.arc(cx, cy, 5, 0, 7); ctx.fill();
}
function velArrow(x1, y1, x2, y2, color = COL.vel, w = 5, head = 15){
  if (Math.hypot(x2 - x1, y2 - y1) < 3) return;
  arrow(x1, y1, x2, y2, color, w, head);
}
function subLabel(main, sub, x, y, o = {}){
  const w = text(main, x, y, { math:true, size:o.size || 20, color:o.color || COL.vel });
  if (sub) text(sub, x + w + 1, y + 5, { math:true, size:(o.size || 20)*0.65, color:o.color || COL.vel });
}
function drawLegend(){
  arrow(24, 34, 60, 34, COL.red, 8, 16);
  text('แรง', 68, 40, { size:15, color:COL.muted });
  velArrow(118, 34, 154, 34);
  text('ความเร็ว', 162, 40, { size:15, color:COL.muted });
}
function bubble(t, x, y, o = {}){ text(t, x, y, { size:o.size || 24, align:o.align || 'left', color:o.color }); }

/* =========================================================
   Scene: Level 1 — push the cart(?) to the flag, on ice (μ = 0) or a rough floor
   Motion is computed analytically per phase so the numbers match the lesson exactly.
   ========================================================= */
function Level1(){
  const S = {
    view:{ ox:110, gy:470, s:110 }, m:40, mu:0, F:100, x0:0.6, pushEnd:1.4, targetX:4.6, flagX:5.9, tol:0.25,
    showMass:false, live:false, timeScale:1,
    f(){ return this.mu*this.m*G; },
    reset(){
      this.cart = { x:this.x0, v:0, a:0 };
      this.ry = { x:-0.25, y:0 };
      this.phase = 'ready'; this.t = 0; this.hist = [{ t:0, v:0 }]; this.bubble = null; this.flags = {};
      this.timeScale = 1; this.stop = null;
    },
    start(p){
      this.reset();
      this.F = p.F;
      if (p.m != null) this.m = p.m;
      if (p.mu != null) this.mu = p.mu;
      this.phase = 'hop'; this.hopT = 0;
      // Speed up very slow runs (push barely beats friction) so nobody waits 20 s.
      const f = this.f(), net = this.F - f;
      this.warp = 1;
      if (net > 0){
        const a1 = net/this.m, tp = Math.sqrt(2*(this.pushEnd - this.x0)/a1), v1 = a1*tp;
        const tc = f > 0 ? v1/(f/this.m) : 0;
        this.warp = Math.max(1, (tp + Math.min(tc, 12))/7);
      }
    },
    rewind(){ this.rw = { t:0, from:Math.min(this.cart.x, 9.5) }; this.phase = 'rewind'; this.timeScale = 1; },
    onParam(p){
      if (this.phase === 'stopped' || this.phase === 'idle') this.reset();
      if (this.live && this.phase === 'ready'){ this.m = p.m; this.mu = p.mu; }
    },
    update(dt){
      const c = this.cart, r = this.ry, f = this.f();
      if (this.phase === 'ready' && this.live){ this.m = pval.m; this.mu = pval.mu; }
      if (this.phase === 'rewind'){
        this.rw.t += dt; const k = Math.min(1, this.rw.t/1.1), e = 1 - (1-k)**3;
        c.x = this.rw.from + (this.x0 - this.rw.from)*e; r.x = c.x; r.y = 0.7;
        if (k >= 1){ this.reset(); emit('rewound'); }
        return;
      }
      if (this.phase === 'hop'){
        this.hopT += dt; const k = Math.min(1, this.hopT/0.5);
        r.x = -0.25 + (c.x + 0.25)*k; r.y = 0.7*k + Math.sin(k*Math.PI)*0.55;
        if (k >= 1){
          this.t = 0; this.idleT = 0;
          if (this.F > 0 && this.F > f){ this.phase = 'push'; this.timeScale = this.warp; }
          else this.phase = 'idle';            // static friction (or nothing) holds it: ΣF = 0
        }
        return;
      }
      if (this.phase === 'idle'){
        this.idleT += dt;
        if (this.idleT > 1.1 && !this.flags.nomove){ this.flags.nomove = 1; emit('nomove'); }
        return;
      }
      if (this.phase === 'push' || this.phase === 'coast'){
        this.t += dt;
        if (this.phase === 'push'){
          c.a = (this.F - f)/this.m;
          c.v = c.a*this.t; c.x = this.x0 + 0.5*c.a*this.t*this.t;
          if (c.x >= this.pushEnd){                       // exact hand-off: v² = 2ad
            const d = this.pushEnd - this.x0;
            c.x = this.pushEnd; c.v = Math.sqrt(2*c.a*d);
            this.v1 = c.v; this.tRel = this.t = Math.sqrt(2*d/c.a);
            if (this.mu === 0){ memo.F = this.F; memo.v1 = c.v; }
            this.phase = 'coast'; emit('pushEnd');
          }
        } else {
          const tc = this.t - this.tRel, dec = f/this.m;
          if (dec > 0 && tc >= this.v1/dec){              // friction brings it to rest: s = v²/2a
            c.v = 0; c.a = 0; c.x = this.pushEnd + this.v1*this.v1/(2*dec); this.t = this.tRel + this.v1/dec;
            this.phase = 'stopped'; this.timeScale = 1;
            this.hist.push({ t:this.tRel + this.v1/dec, v:0 });
            const err = c.x - this.targetX;
            this.stop = { x:c.x, err, ok:Math.abs(err) <= this.tol };
            emit('stopped', this.stop);
          } else {
            c.a = -dec; c.v = this.v1 - dec*tc; c.x = this.pushEnd + this.v1*tc - 0.5*dec*tc*tc;
          }
        }
        r.x = c.x; r.y = 0.7;
        if (this.mu === 0 && c.x > this.targetX + this.tol && !this.flags.over){ this.flags.over = 1; this.bubble = 'บ๊ายบาย~'; }   // sailing past the spot
        if (c.x - 0.4 > this.flagX && !this.flags.pass){ this.flags.pass = 1; emit('passFlag'); }
        if (c.x > 8.9 && this.phase !== 'stopped' && !this.flags.gone){ this.flags.gone = 1; emit('gone'); }
        if (this.phase !== 'stopped' && this.t - this.hist[this.hist.length-1].t > 0.05 && this.t < 60) this.hist.push({ t:this.t, v:c.v });
      }
    },
    readout(){
      const c = this.cart, f = this.f();
      let net = 0;
      if (this.phase === 'push') net = this.F - f;
      else if (this.phase === 'coast') net = -f;
      const moved = this.phase === 'push' || this.phase === 'coast' || this.phase === 'stopped';
      return [ net.toFixed(1), (net/this.m).toFixed(2), c.v.toFixed(2), moved ? (c.x - this.x0).toFixed(2) : '0.00', moved ? this.t.toFixed(2) : '0.00' ];
    },
    draw(){
      const v = this.view, c = this.cart, r = this.ry, s = v.s, f = this.f(), rough = this.mu > 0;
      drawFloor(v, { rough, label: rough ? `พื้นฝืด μ = ${this.mu.toFixed(2)}` : 'ลานน้ำแข็ง' });
      // the hand only pushes over this short stretch
      ctx.fillStyle = 'rgba(255,159,58,.28)';
      ctx.fillRect(P(v, this.x0), v.gy + 1, (this.pushEnd - this.x0)*s, 29);
      text('ช่วงผลัก', P(v, (this.x0 + this.pushEnd)/2), v.gy + 20, { size:13, align:'center', color:'#8a4d00' });
      // parking spot in front of the flag
      ctx.fillStyle = 'rgba(46,139,87,.25)';
      ctx.fillRect(P(v, this.targetX - this.tol), v.gy + 1, this.tol*2*s, 29);
      if (c.x < this.targetX - 0.05 && this.phase !== 'rewind')
        dimLine(P(v, c.x), v.gy + 40, P(v, this.targetX), v.gy + 40, `ระยะถึงจุดจอด ${(this.targetX - c.x).toFixed(1)} m`);
      drawFlag(P(v, this.flagX), v.gy, s);
      drawCart(P(v, c.x), v.gy, s, this.showMass ? `${this.m} kg` : null);
      drawRyuka(P(v, r.x), Y(v, r.y), s, { sad: this.mu === 0 && this.flags.over });
      if (this.phase === 'ready') fbd(P(v, c.x), 150, { f:rough });
      const back = P(v, c.x - 0.4);
      const pushing = this.phase === 'push' || (this.phase === 'idle' && this.F > 0);
      if (pushing){
        const len = 30 + Math.min(this.F, 160)*0.9;
        gradArrow(back - len - 6, Y(v, 0.35), back - 4);
        text(`F = ${this.F} N`, back - len/2 - 6, Y(v, 0.35) - 18, { size:18, align:'center', math:true, italic:false });
      }
      // friction acts along the floor, opposite to the sliding (static: just enough to cancel the push)
      const fNow = this.phase === 'push' || this.phase === 'coast' ? f
                 : this.phase === 'idle' && this.F > 0 ? Math.min(this.F, f) : 0;
      if (rough && fNow > 0){
        const len = 24 + Math.min(fNow, 160)*0.9, fx = P(v, c.x);
        arrow(fx, v.gy - 7, fx - len, v.gy - 7, COL.fric, 7, 16);
        text(`f = ${fNow.toFixed(1)} N`, P(v, c.x - 0.4) - 6, v.gy - 14, { size:16, align:'right', color:COL.fric, math:true, italic:false });
      }
      if (c.v > 0.005 && P(v, c.x) < 720){                 // velocity: thin blue arrow from the middle of the box (gone before its label reaches the panel)
        const fx = P(v, c.x), len = Math.min(220, c.v*40), vy = Y(v, 0.35);
        velArrow(fx, vy, fx + len, vy);
        text(`v = ${c.v.toFixed(2)} m/s`, Math.max(fx + len, P(v, c.x + 0.4)) + 6, vy + 5, { size:15, color:COL.vel, math:true, italic:false });
      }
      drawLegend();
      // the bubble travels with Ryuka: behind the panel, out the other side, until she leaves the stage
      if (this.bubble && P(v, r.x) - 50 < W) bubble(this.bubble, P(v, r.x) - 30, Y(v, r.y + 1.35), { size:26 });
      if (this.timeScale > 1) text(`เร่งเวลา ×${this.timeScale.toFixed(1)}`, 24, 108, { size:17, color:COL.muted });
    }
  };
  S.reset();
  return S;
}

/* Lesson: cart(?) still sliding — the floor scrolls so the motion is visible */
function Moving(vel){
  return {
    view:{ ox:0, gy:470, s:110 }, v:vel, scroll:0, bubble:null, sad:false, cx:640,
    update(dt){ this.scroll += this.v*dt; },
    draw(){
      const v = this.view;
      drawFloor(v, { scroll:this.scroll });
      // speed streaks
      ctx.strokeStyle = 'rgba(61,123,116,.35)'; ctx.lineWidth = 3;
      for (let i = 0; i < 3; i++){
        const y = v.gy - 20 - i*24, off = (this.scroll*110*1.7 + i*40) % 60;
        ctx.beginPath(); ctx.moveTo(this.cx - 70 - off, y); ctx.lineTo(this.cx - 120 - off, y); ctx.stroke();
      }
      drawCart(this.cx, v.gy, v.s);
      drawRyuka(this.cx, v.gy - 0.7*v.s, v.s, { sad:this.sad });
      const len = Math.min(220, this.v*40), vy = v.gy - 0.35*v.s;
      velArrow(this.cx, vy, this.cx + len, vy);
      drawLegend();
      text('ยังขยับอยู่ >>', this.cx - 75, v.gy - 0.7*v.s - 70, { size:26, align:'right' });
      text(`v = ${this.v.toFixed(2)} m/s (คงที่)`, this.cx, v.gy + 56, { size:19, align:'center', color:COL.muted });
      if (this.bubble) bubble(this.bubble, this.cx + 40, v.gy - 0.7*v.s - 145, { size:26, align:'center' });
    }
  };
}

/* Lesson: free-body diagram beside the cart(?) */
function Diagram(){
  return {

/* Lesson: push → let go, looping, with the board rows lit by phase */
function PushDemo(F){
  const a = F/40;
  const tp = Math.sqrt(2*0.8/a), tc = Math.min(2.2, 3.2/(a*tp)), tw = 0.8;
  return {
    view:{ ox:120, gy:470, s:110 }, t:0, x:0, v:0, ph:'push',
    update(dt){
      this.t += dt;
      if (this.t < tp){ this.ph = 'push'; this.v = a*this.t; this.x = 0.5*a*this.t*this.t; }
      else if (this.t < tp + tc){ this.ph = 'coast'; this.v = a*tp; this.x = 0.5*a*tp*tp + this.v*(this.t - tp); }
      else if (this.t < tp + tc + tw){ this.ph = 'wait'; }
      else { this.t = 0; }
      const r1 = $('rowPush'), r2 = $('rowCoast');
      if (r1){ r1.classList.toggle('on', this.ph === 'push'); r2.classList.toggle('on', this.ph === 'coast'); }
    },
    draw(){
      const v = this.view, cx = P(v, 0.4 + this.x);
      drawFloor(v, {});
      drawCart(cx, v.gy, v.s);
      drawRyuka(cx, v.gy - 0.7*v.s, v.s, { sad:true });
      if (this.ph === 'push') arrow(cx - 0.4*v.s - 110, v.gy - 0.35*v.s, cx - 0.4*v.s - 6, v.gy - 0.35*v.s, COL.red, 12, 26);
      if (this.v > 0.005) velArrow(cx, v.gy - 0.35*v.s, cx + Math.min(220, this.v*40), v.gy - 0.35*v.s);
      drawLegend();
      text(this.ph === 'push' ? 'กำลังผลัก' : this.ph === 'coast' ? 'มือหลุดแล้ว' : '',
           70, 120, { size:24 });
      text(`v = ${this.v.toFixed(2)} m/s`, 70, 152, { size:20, color:COL.muted });
    }
  };
}

/* =========================================================
   Scene: Bonus — the cart(?) is stopped, Ryuka isn't → projectile
   ========================================================= */
function Projectile(){
  const S = {
    view:{ ox:40, gy:450, s:110 }, edge:1.8, hLaunch:1.9, flagX:4.8, tol:0.25, v:3,
    stopper:false, stopperDrop:1, showGuides:false, showPair:false, timeScale:1,
    reset(){
      this.phase = 'ready'; this.cart = { x:0.2 }; this.ry = { x:0.2, y:1.9, rot:0 };
      this.dots = []; this.ft = 0; this.land = null; this.bubble = null; this.pairT = 9; this.flags = {}; this.timeScale = 1;
    },
    tFlight(){ return Math.sqrt(2*this.hLaunch/G); },
    readoutNote(){ return this.phase === 'ready' && this.v > 0 ? 'ค่าที่คาดว่าจะได้ตอนตกถึงพื้น' : null; },
    start(v){
      const prev = this.dots.length ? this.dots : this.ghost;
      this.reset(); this.ghost = prev;
      this.v = v; this.phase = v > 0 ? 'roll' : 'still'; this.stillT = 0;
    },
    onParam(p){
      if (this.phase === 'landed' || this.phase === 'still'){ if (this.dots.length) this.ghost = this.dots; this.reset(); }
      if (this.phase === 'ready') this.v = p.v;
    },
    dropStopper(){ this.stopper = true; this.stopperDrop = 0; },
    rewind(){ this.reset(); this.phase = 'rewind'; this.rwT = 0; this.rwFrom = 9.5; },
    pos(t){ return { x:this.edge + this.v*t, y:this.hLaunch - 0.5*G*t*t }; },
    update(dt){
      if (this.stopperDrop < 1) this.stopperDrop = Math.min(1, this.stopperDrop + dt/0.45);
      const c = this.cart, r = this.ry;
      switch (this.phase){
        case 'rewind': {
          this.rwT += dt; const k = Math.min(1, this.rwT/1.2), e = 1 - (1-k)**3;
          c.x = this.rwFrom + (0.2 - this.rwFrom)*e; r.x = c.x; r.y = 1.9;
          if (k >= 1){ this.phase = 'ready'; emit('rewound'); }
          break;
        }
        case 'still':
          this.stillT += dt;
          if (this.stillT > 0.9 && !this.flags.still){ this.flags.still = 1; emit('still'); }
          break;
        case 'roll':
          c.x += this.v*dt; r.x = c.x;
          if (c.x + 0.4 >= this.edge){
            const over = c.x + 0.4 - this.edge;
            c.x = this.edge - 0.4; r.x = c.x + over;
            this.phase = 'slide'; this.pairT = 0; this.timeScale = 0.35; emit('impact');
          }
          break;
        case 'slide':                              // cart stopped; Ryuka keeps going (inertia, slippery seat)
          this.pairT += dt; r.x += this.v*dt;
          if (r.x >= this.edge){ this.phase = 'fly'; this.ft = (r.x - this.edge)/this.v; this.nextDot = 0; }
          break;
        case 'fly': {
          this.pairT += dt; this.ft += dt;
          const tl = this.tFlight();
          while (this.nextDot <= Math.min(this.ft, tl) + 1e-9){ this.dots.push(this.pos(this.nextDot)); this.nextDot += 0.05; }
          const t = Math.min(this.ft, tl), p = this.pos(t);
          r.x = p.x; r.y = p.y; r.rot = Math.min(0.55, t*1.3);
          if (this.ft >= tl){
            this.ft = tl;
            const err = p.x - this.flagX, ok = Math.abs(err) <= this.tol;
            this.land = { x:p.x, err, ok };
            r.y = ok ? 0.16 : 0; r.rot = ok ? 0 : Math.PI/2;
            this.bubble = ok ? 'รอดแล้ว~' : 'โอ๊ย…';
            this.phase = 'landed'; this.timeScale = 1;
            emit('landed', this.land);
          }
          break;
        }
      }
    },
    readout(){
      // t: since the cart is released · t_air: since Ryuka leaves the edge
      // x: measured from the platform edge (x = 0 where the flight starts, flag at x = D); negative on the platform
      if (this.phase === 'rewind') return [null, null, null, null, null, null];
      const x0 = 0.2, roll = this.edge - x0;
      if (this.phase === 'ready' && this.v > 0){            // while the slider moves: predicted values at touchdown
        const tl = this.tFlight();
        return [ (roll/this.v + tl).toFixed(2), tl.toFixed(2), (this.v*tl).toFixed(2),
                 this.hLaunch.toFixed(2), this.v.toFixed(2), (-G*tl).toFixed(2) ];
      }
      const inAir = this.phase === 'fly' || this.phase === 'landed';
      const ft = inAir ? this.ft : 0;
      const moving = this.phase !== 'ready' && this.phase !== 'still';
      const T = !moving ? 0 : inAir ? roll/this.v + ft : (this.ry.x - x0)/this.v;
      const X = (moving ? this.ry.x : x0) - this.edge;
      const vx = this.phase === 'still' ? 0 : this.v;
      return [ T.toFixed(2), ft.toFixed(2), X.toFixed(2), (0.5*G*ft*ft).toFixed(2), vx.toFixed(2), (ft ? -G*ft : 0).toFixed(2) ];
    },
    draw(){
      const v = this.view, s = v.s, c = this.cart, r = this.ry;
      drawFloor(v, { ticks:{ from:-1, to:this.ticksTo || 5, zero:this.edge } });
      // ice platform
      const px0 = P(v, -0.8), px1 = P(v, this.edge + 0.12), top = Y(v, 1.2);
      ctx.fillStyle = '#D6E8EE'; ctx.fillRect(px0, top, px1 - px0, v.gy - top);
      ctx.strokeStyle = COL.iceLine; ctx.lineWidth = 2; ctx.strokeRect(px0, top, px1 - px0, v.gy - top);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(px0 + 20, top + 10); ctx.lineTo(px1 - 30, top + 10); ctx.stroke();
      text('แท่นน้ำแข็ง สูง 1.2 m', (px0 + px1)/2 - 10, top + 70, { size:16, align:'center', color:COL.muted });
      // stopper
      if (this.stopper){
        const drop = (1 - this.stopperDrop)*3.2;
        const sx = P(v, this.edge), sy = Y(v, 1.2 + 0.45 + drop);
        ctx.fillStyle = '#2b2f36'; rr(sx, sy, 0.12*s, 0.45*s, 4); ctx.fill();
        if (this.stopperDrop >= 1 && this.phase === 'ready') text('ที่กั้น', sx + 0.06*s, sy - 8, { size:15, align:'center', color:COL.muted });
      }
      // dimensions h and D
      const hx = P(v, this.edge + 0.32);
      if (!this.showPair){                                   // hidden while the impact-force pair is explained
      ctx.setLineDash([5, 5]); ctx.strokeStyle = '#b5bcc6'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(P(v, this.edge), Y(v, this.hLaunch)); ctx.lineTo(hx + 8, Y(v, this.hLaunch)); ctx.stroke();
      ctx.setLineDash([]);
      dimLine(hx, v.gy, hx, Y(v, this.hLaunch), '', { color:COL.muted });
      if (!this.showGuides && !['fly', 'landed'].includes(this.phase)) text('h = 1.9 m', hx + 10, Y(v, 0.55), { size:18, math:true, italic:false, color:COL.muted });
      }
      dimLine(P(v, this.edge), v.gy + 42, P(v, this.flagX), v.gy + 42, 'D = 3.0 m', { color:COL.muted });
      // flag + cushion
      drawFlag(P(v, this.flagX), v.gy, s);
      ctx.fillStyle = '#F6C76A'; rr(P(v, this.flagX - 0.3), v.gy - 0.16*s, 0.6*s, 0.16*s, 8); ctx.fill();
      // strobe dots (every 0.05 s)
      if (this.showGuides && this.dots.length){
        ctx.setLineDash([4, 5]); ctx.strokeStyle = '#b5bcc6'; ctx.lineWidth = 1.2;
        this.dots.forEach(d => {
          ctx.beginPath(); ctx.moveTo(P(v, d.x), Y(v, d.y)); ctx.lineTo(P(v, d.x), v.gy); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(P(v, d.x), Y(v, d.y)); ctx.lineTo(P(v, this.edge), Y(v, d.y)); ctx.stroke();
        });
        ctx.setLineDash([]);
      }
      if (this.ghost && this.ghost.length){                  // previous try, for comparison
        ctx.fillStyle = '#C9D1DC';
        this.ghost.forEach(d => { ctx.beginPath(); ctx.arc(P(v, d.x), Y(v, d.y), 3, 0, 7); ctx.fill(); });
      }
      ctx.fillStyle = COL.dot;
      this.dots.forEach(d => { ctx.beginPath(); ctx.arc(P(v, d.x), Y(v, d.y), 4, 0, 7); ctx.fill(); });
      // cart + Ryuka
      drawCart(P(v, c.x), Y(v, 1.2), s);
      drawRyuka(P(v, r.x), Y(v, r.y), s, { rot:r.rot, lie:this.land && !this.land.ok, sad:this.phase === 'fly' || (this.land && !this.land.ok) });
      // 3rd-law pair at the impact
      if ((this.pairT < 0.22 && (this.phase === 'slide' || this.phase === 'fly')) || this.showPair){
        const ix = P(v, this.edge), iy = Y(v, 1.2 + 0.2);
        arrow(ix + 4, iy - 10, ix + 70, iy - 10, COL.red, 7, 16);
        arrow(ix - 4, iy + 12, ix - 70, iy + 12, COL.red, 7, 16);
        text('รถดันที่กั้น', ix + 22, iy + 16, { size:14 });
        text('ที่กั้นดันรถ', ix - 40, iy + 50, { size:14, align:'center' });
      }
      // velocity of Ryuka (14 px per m/s); in flight split into vx (constant) and vy (growing)
      // arrows start at Ryuka's belt (0.46 m above the feet), following the sprite's tilt in flight
      const K = 10, belt = 0.14*s, rot = r.rot || 0;
      const cx = P(v, r.x) - belt*Math.sin(rot), cy = Y(v, r.y) - 0.6*s + belt*Math.cos(rot);
      if (this.phase === 'ready' || this.phase === 'roll' || this.phase === 'slide'){
        if (this.v > 0){
          velArrow(cx, cy, cx + this.v*K, cy);
          text(`v = ${this.v.toFixed(1)} m/s`, Math.max(cx + this.v*K, cx + 46) + 8, cy + 6, { size:17, color:COL.vel, math:true, italic:false });
        }
      }
      if (this.phase === 'fly'){
        const vy = G*Math.min(this.ft, this.tFlight());
        arrow(cx - 26, cy, cx - 26, cy + 70, COL.red, 7, 16);
        if (cx - 60 > P(v, this.edge) + 16 && cy + 92 < v.gy - 6) text('mg', cx - 26, cy + 92, { math:true, size:20, align:'center' });   // under its arrow, not over the cart
        velArrow(cx, cy, cx + this.v*K, cy, COL.velLight, 3, 11);
        velArrow(cx, cy, cx, cy + vy*K, COL.velLight, 3, 11);
        velArrow(cx, cy, cx + this.v*K, cy + vy*K);
        const lx = Math.max(cx + this.v*K, cx + 46) + 6, floorY = v.gy - 6;
        if (vy*K > 14) subLabel('v', 'x', lx, cy - 6, { size:18, color:'#5B7FD0' });   // once it splits from v
        if (vy*K > 40 && cy + vy*K + 4 < floorY) subLabel('v', 'y', cx + 6, cy + vy*K + 4, { size:18, color:'#5B7FD0' });
        const ry = cy + Math.max(vy*K, 20) + 20;
        if (ry < floorY) subLabel('v', '', lx + 2, ry, { size:20 });
      }
      drawLegend();
      if (this.land){
        const lx = P(v, this.land.x);
        ctx.fillStyle = this.land.ok ? '#2E8B57' : COL.red;
        ctx.beginPath(); ctx.moveTo(lx, v.gy + 4); ctx.lineTo(lx - 8, v.gy + 18); ctx.lineTo(lx + 8, v.gy + 18); ctx.fill();
      }
      if (this.bubble){
        if (this.land && !this.land.ok){
          if (this.land.x > this.flagX) bubble(this.bubble, P(v, r.x + 0.7), Y(v, 0.45));
          else bubble(this.bubble, P(v, r.x), Y(v, 1.15), { align:'center' });
        } else bubble(this.bubble, P(v, r.x), Y(v, 2.05), { align:'center' });
      }
      if (this.timeScale < 1) text('สโลว์โมชัน ×0.35', 24, 108, { size:17, color:COL.muted });
    }
  };
  S.reset();
  return S;
}

/* ---------- main loop ---------- */
let scene = null, last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  ctx.clearRect(0, 0, W, H);
  if (scene){
    scene.update && scene.update(dt*(scene.timeScale || 1));
    scene.draw();
  }
  if (panelMode) updateReadout();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

    else await say('ryuka', `“${msg}”`, { sad:true });
  }
  showPanel(null);
}

// tags: the misconception behind each wrong option (logged for the teacher; '' for the right one)
async function quiz(id, q, opts, correct, why, wrong, tags){
  const b = board(`<div class="q">${q}</div><div class="opts">${opts.map((o, i) =>
      `<button class="opt" data-i="${i}">${'กขคง'[i]}. ${o}</button>`).join('')}</div>`, true);
  const btns = [...b.querySelectorAll('.opt')];
  const t0 = performance.now(), picks = [];
  let tFirst = 0;
  while (true){
    say('dad', 'ตอบคำถามบนกระดานหน่อย', { wait:false });
    const pick = await new Promise(res => btns.forEach(x => x.onclick = () => res(+x.dataset.i)));
    if (!picks.length) tFirst = performance.now() - t0;
    picks.push(pick);
    if (pick === correct){
      track.quiz(id, picks, correct, tags, tFirst, performance.now() - t0);
      btns[pick].classList.add('right'); btns.forEach(x => x.disabled = true);
      await say('dad', `ถูกต้อง! ${why}`);
      return;
    }
    btns[pick].classList.add('wrong'); btns[pick].disabled = true;
    await say('dad', wrong[pick]);
  }
}

async function ending(){
  showPanel(null); board(null); $('dialog').hidden = true; setTitle('');
  if (!track.feedbackDone) await feedback();
  overlay(`<h2>สรุปสิ่งที่ริวกะได้เรียนรู้ (แบบเจ็บตัว)</h2>
    <div class="sumGrid">
      <div class="law"><b>กฎข้อ 1</b> ถ้า ΣF = 0 ความเร็วไม่เปลี่ยน นิ่งก็นิ่งต่อ วิ่งก็วิ่งต่อด้วยความเร็วคงที่ รถ(?)บนน้ำแข็งเลยไม่หยุดเอง</div>
      <div class="law"><b>แรงเสียดทาน</b> f = μmg ชี้สวนทางการเคลื่อนที่ ทำให้รถช้าลงจนหยุด รถหยุดเพราะแรงเสียดทาน ไม่ใช่เพราะเลิกผลัก</div>
      <div class="law"><b>กฎข้อ 2</b> ΣF = ma แรงลัพธ์ทำให้ความเร็ว<i>เปลี่ยน</i> ไม่ได้ถูกเก็บไว้ในวัตถุ หมดแรงลัพธ์เมื่อไหร่ ความเร่งก็เป็น 0</div>
      <div class="law"><b>สมการการเคลื่อนที่</b> เมื่อความเร่งคงที่: v = u + at · s = ut + ½at² · v² = u² + 2as ใช้ทีละช่วงที่แรงลัพธ์คงที่</div>
      <div class="law"><b>กฎข้อ 3</b> รถดันที่กั้น = ที่กั้นดันรถ (ขนาดเท่ากัน ทิศตรงข้าม) กระทำต่อวัตถุคนละก้อน จึงไม่หักล้างกัน</div>
      <div class="law"><b>โพรเจกไทล์</b> แกน x: x = v t (ไม่มีแรง) · แกน y: Δy = ½ g t² · เวลาลอย t = √(2h/g) ขึ้นกับความสูงอย่างเดียว</div>
    </div>
    <div class="links"><button id="again">เล่นใหม่ตั้งแต่ต้น</button><button id="againBonus">เล่นด่านแถมอีกรอบ</button></div>`);
  $('again').onclick = () => run(FULL_RUN, 'replay');
  $('againBonus').onclick = () => run(['bonus', 'end'], 'replay:bonus');
}

// End-of-game survey for the teacher (once per session).
function feedback(){
  const parts = track.visited.filter(k => k !== 'end');
  const scale = (k, label, lo, hi) => `<div class="scale" data-k="${k}" role="group" aria-label="${label}">${[1, 2, 3, 4, 5].map(n =>
      `<button data-v="${n}" aria-pressed="false">${n}</button>`).join('')}</div><small>1 = ${lo} · 5 = ${hi}</small>`;
  overlay(`<h2>ก่อนดูสรุป ช่วยตอบสั้นๆ หน่อยนะ</h2>
    <div class="fb">
      <div class="fbRow"><span>เกมนี้ยากแค่ไหน</span>${scale('difficulty', 'เกมนี้ยากแค่ไหน', 'ง่ายมาก', 'ยากมาก')}</div>
      <div class="fbRow"><span>สนุกแค่ไหน</span>${scale('enjoyment', 'สนุกแค่ไหน', 'ไม่สนุกเลย', 'สนุกมาก')}</div>
      <div class="fbRow"><span>ส่วนไหนยากที่สุด</span><div class="scale" data-k="hardest" role="group" aria-label="ส่วนไหนยากที่สุด">${parts.map(k =>
        `<button data-v="${k}" aria-pressed="false">${PART_NAME[k]}</button>`).join('')}</div></div>
      <div class="fbRow"><label for="fbQ">ยังสงสัยอะไรอยู่ไหม</label><textarea id="fbQ" maxlength="300" placeholder="ส่วนที่ยังไม่เข้าใจ หรืออยากถามอะไร (ไม่บังคับ)"></textarea></div>
    </div>
    <div class="startRow"><button class="btnDark" id="fbSend">ส่ง แล้วดูสรุป</button><button class="btnGhost" id="fbSkip">ข้าม</button></div>`);
  const ans = {};
  $('overlay').querySelectorAll('.scale').forEach(g => g.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    g.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    ans[g.dataset.k] = b.dataset.v;
  }));
  return new Promise(res => {
    $('fbSend').onclick = () => {
      track.feedback({ difficulty:+ans.difficulty || '', enjoyment:+ans.enjoyment || '',
        hardest:ans.hardest ? PART_NAME[ans.hardest] : '', question:$('fbQ').value.trim(), skipped:false });
      res();
    };
    $('fbSkip').onclick = () => { track.feedback({ skipped:true }); res(); };
  });
}

const STEPS = { ch1:chapter1, lesson, fric:frictionLevel, fricLesson:frictionLesson, sandbox, bonus, end:ending };
async function run(list, entry = 'replay'){
  overlay(null); waiters = {};
  track.begin(entry);
  for (const k of list){
    track.enter(k);
    await STEPS[k]();
    track.leave(true);
    track.saveProgress(FULL_RUN[FULL_RUN.indexOf(k) + 1] || null);
  }
}

function titleScreen(){
  showPanel(null); board(null); $('dialog').hidden = true; setTitle('');
  scene = null;
  overlay(`<div class="heroRow"><img src="${IMG.n.src}" alt="ริวกะ"><div class="heroCart"></div></div>
    <h1>กฏการเคลื่อนที่ของนิวตัน</h1>
    <h2>ริวกะกับรถ(?)ที่ไม่ยอมหยุด · แรงเสียดทาน · แถมท้ายด้วยการเคลื่อนที่แบบโพรเจกไทล์</h2>
    <div class="who">
      <label>ชื่อ <input id="whoName" maxlength="40" autocomplete="off" placeholder="ชื่อ-นามสกุล หรือชื่อเล่น"></label>
      <label>ห้อง <input id="whoRoom" maxlength="12" autocomplete="off" placeholder="เช่น ม.4/2"></label>
    </div>
    <div class="whoHint" id="whoHint" aria-live="polite"></div>
    <div class="startRow"><button class="btnDark" id="start">เริ่มเล่น</button><button class="btnGhost" id="resume" hidden></button></div>
    <div class="links">ข้ามไป: ${['lesson', 'fric', 'sandbox', 'bonus'].map(k =>
      `<button data-from="${k}">${PART_NAME[k]}</button>`).join('')}</div>`);
  const nameEl = $('whoName'), roomEl = $('whoRoom'), saved = track.student || {};
  nameEl.value = saved.name || ''; roomEl.value = saved.room || '';
  const clean = s => s.replace(/\s+/g, ' ').trim();
  const who = () => ({ name:clean(nameEl.value), room:clean(roomEl.value) });
  const showResume = () => {
    const p = track.progressOf(who()), b = $('resume');
    b.hidden = !(p && p.next && p.next !== 'ch1');
    if (!b.hidden) b.textContent = `เล่นต่อ: ${PART_NAME[p.next]}`;
  };
  [nameEl, roomEl].forEach(el => el.addEventListener('input', () => {
    el.classList.remove('err'); $('whoHint').textContent = ''; showResume();
  }));
  showResume();
  const go = (from, entry) => {
    const w = who();
    nameEl.classList.toggle('err', !w.name); roomEl.classList.toggle('err', !w.room);
    if (!w.name || !w.room){
      $('whoHint').textContent = 'กรอกชื่อและห้องก่อนเริ่มเล่นนะ';
      (w.name ? roomEl : nameEl).focus();
      return;
    }
    track.student = w; store.set('student', w);
    run(FULL_RUN.slice(FULL_RUN.indexOf(from)), entry);
  };
  $('start').onclick = () => go('ch1', 'start');
  $('resume').onclick = () => {
    const p = track.progressOf(who());
    if (!p || !p.next) return;
    Object.assign(memo, p.memo || {});      // the lessons reuse the student's own numbers from earlier levels
    go(p.next, 'resume:' + p.next);
  };
  $('overlay').querySelectorAll('[data-from]').forEach(b => b.onclick = () => go(b.dataset.from, 'skip:' + b.dataset.from));
  (nameEl.value && roomEl.value ? $('start') : nameEl).focus();
}
titleScreen();
</script>
